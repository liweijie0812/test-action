name: PR_COMMENT_CI

on:
  issue_comment:
    types: [created]
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      next_action: ${{ steps.get-action.outputs.next_action }}
    if: ${{ github.event.issue.pull_request }}
    steps:
       - uses: actions/checkout@v4
         with:
          sparse-checkout: |
            .github/pr-common-ci.md
          sparse-checkout-cone-mode: false
       - run: cat .github/pr-common-ci.md
       - uses: actions/github-script@v7
         id: get-action
         with:
          script: |
            core.info(`context: ${JSON.stringify(context)}`)
            const user = context.payload.comment.user.login
            core.debug(`user: ${user}`)

            let isReviewer = false;
            if ('liweijie0812' === `${user}`) {
                isReviewer = true
            }

            let next_action = ''  
            if (isReviewer) {
              const body = context.payload.comment.body
              core.info(`body: ${body}`)
              if (body.startsWith('/update-common')) {
                next_action='update-common'
              }
              if (body.startsWith('/test-common')) {
                next_action='test-common'
              }
              if (body.startsWith('/resolve-conflict')) {
                next_action='resolve-conflict'
              }
              if (body.startsWith('/test-sh')) {
                next_action='test-sh'
              }  
              if (body.startsWith('/pkg-pr-new')) {
                next_action='pkg-pr-new'
              }  
              
              if(next_action){
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'rocket',
                })
              }
            } else {
               core.warning('You are not collaborator');
            }
            core.info(`next_action: ${next_action}`)
            core.setOutput('next_action', next_action)

            
  test-common:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'test-common' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: gh checkout pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}
      - name: git config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: submodule init and sync remote
        run: |
          git submodule update --init --remote
      - name: log sha
        run: |
            abbrev_commit_log=$(git log -1 --abbrev=7 --format=%h) || true
            echo "abbrev_commit_log: $abbrev_commit_log"
      - name: Commit common
        run: |
          git status
          working_tree_clean=$(git status | grep -c 'nothing to commit, working tree clean') || true
          if [ "$working_tree_clean" -eq "0" ]; then
            git add .
            git commit -m "chore: update common"
          fi
          git status

      - name: merge develop
        run: |
          git merge develop --no-commit || true

      - name: check conflicts
        run: |
          git status
          conflict_count=$(git status | grep -c 'both modified:') || true
          working_tree_clean=$(git status | grep -c 'nothing to commit, working tree clean') || true
          common_conflict=$(git status | grep 'both modified:' | grep -c '_common') || true
          conflicts_sum=$((common_conflict))
          echo "conflict_count: $conflict_count"
          echo "working_tree_clean: $working_tree_clean"
          echo "common_conflict: $common_conflict"
          echo "conflicts_sum: $conflicts_sum"

          if [ "$working_tree_clean" -eq "1" ]; then
              echo "nothing to commit, working tree clean"
              exit 0
          fi

          if [ "$conflict_count" -gt "0" ]&&[ "$conflicts_sum" -eq "0" ]; then
              echo "Unknown conflict "
              git status
              exit 1
          fi

          if [ "$common_conflict" -eq "1" ];then
              git checkout --ours src/_common
              git add src/_common
              echo "resolve conflict _common"
          fi

          git status
          git commit -am "chore: merge develop"

      - name: log sha
        run: |
          abbrev_commit_log=$(git log -1 --abbrev=7 --format=%h) || true
          echo "abbrev_commit_log: $abbrev_commit_log"
          
      - run: git status 

       
  update-common:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'update-common' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: gh checkout pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }} --recurse-submodules 
      - run: git submodule update --remote --merge
      - uses: stefanzweifel/git-auto-commit-action@v5
        with: 
          commit_message: 'chore: update common'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot]'
  
  resolve-conflict:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'resolve-conflict' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          fetch-depth: 0
      - name: gh checkout pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }} --recurse-submodules
      - name: Merge develop
        run: |
          git branch
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git merge develop 
      - name: push to pr
        run: |
          # git add .
          # git commit -am "chore: Merge develop"
          
          git push
          
  help:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'help' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/pr-common-ci.md
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const doc = fs.readFileSync('.github/pr-common-ci.md', 'utf8')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: doc
            })
  test-sh:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'test-sh' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          fetch-depth: 0
      - name: gh checkout pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }} --recurse-submodules

      - name: Merge develop
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git merge develop --no-commit || true
          git status
          
      - name: Resolve conflict
        run: |
          sh .github/script/test-sh.sh
          
          git status > ~/git-status.txt
          cat ~/git-status.txt
          cat ~/git-status.txt | grep -c 'modified:'
          cat ~/git-status.txt | grep -c 'both modified:'
          cat ~/git-status.txt | grep -c 'committed:'
          conflict_count=$(cat ~/git-status.txt | grep -c 'both modified:') 
          working_tree_clean=$(cat ~/git-status.txt | grep -c 'nothing to commit, working tree clean')
          csr_snap_conflict=$(cat ~/git-status.txt | grep 'both modified:' | grep -c 'csr.test.jsx.snap') 
          ssr_snap_conflict=$(cat ~/git-status.txt | grep 'both modified:' | grep -c 'ssr.test.jsx.snap')
          common_conflict=$(cat ~/git-status.txt | grep 'both modified:' | grep -c '_common')
          conflicts_sum=$((csr_snap_conflict + ssr_snap_conflict + common_conflict))
          echo "conflict_count: $conflict_count"
          echo "working_tree_clean: $working_tree_clean"
          echo "csr_snap_conflict: $csr_snap_conflict"
          echo "ssr_snap_conflict: $ssr_snap_conflict"
          echo "common_conflict: $common_conflict"
          echo "conflicts_sum: $conflicts_sum"
  
  pkg-pr-new:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ needs.check.outputs.next_action == 'pkg-pr-new' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: gh checkout pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install  

      - run: pnpm build
      
      - name: pr commit sha
        id: pr-commit-sha
        run: |
            abbrev_commit_log=$(git log -1 --abbrev=7 --format=%h) || true
            echo "abbrev_commit_log: $abbrev_commit_log"
            echo "::set-output name=sha::$abbrev_commit_log"

      - name: print pr sha
        run: |
            echo "pr sha: ${{ steps.pr-commit-sha.outputs.sha }}"
      - run: npx pkg-pr-new publish

      - run: git status 

       
